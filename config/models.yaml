# Per-node model routing via OpenRouter (OpenAI-compatible). Set OPENROUTER_API_KEY.
# "Pro" = high tier (planner/writer/consolidation); "Flash" = everything else.
# DeepSeek accepts temperature; the map below applies to any node that sets one.
default: deepseek/deepseek-v4-pro
# Tried once for ANY node after the primary model exhausts its retries (outage, content
# filter, persistent 5xx) - the cheapest reliable tier, so a node failure degrades instead
# of killing an unattended run. Empty = no fallback.
fallback: deepseek/deepseek-v4-flash

nodes:
  planner:       deepseek/deepseek-v4-pro      # sets the book's DNA
  writer:        deepseek/deepseek-v4-pro      # prose quality
  consolidation: deepseek/deepseek-v4-pro      # global reasoning across the whole book
  toc:           deepseek/deepseek-v4-flash
  critic:        deepseek/deepseek-v4-pro      # pro-tier judge: insight scoring + thesis checks
                                               # need real judgment, worth the extra cost/latency
  judge:         deepseek/deepseek-v4-pro      # ranks divergent drafts side-by-side (best-of-N).
                                               # Route to a NON-DeepSeek slug for an independent,
                                               # cross-family judge (decorrelated blind spots).
  verifier:      deepseek/deepseek-v4-pro      # checks each cited claim against its source text;
                                               # cross-family routing here also helps
  summarizer:    deepseek/deepseek-v4-flash    # chapter summaries + canon extraction
  production:    deepseek/deepseek-v4-flash    # front/back matter + assembly
  learner:       deepseek/deepseek-v4-flash    # distill skills from a finished book
  researcher:    deepseek/deepseek-v4-flash    # optional shallow research brief (off by default)
  humanizer:     deepseek/deepseek-v4-flash    # strip AI tells from committed prose
  chat:          deepseek/deepseek-v4-flash    # TUI conversational assistant
  diagram:       deepseek/deepseek-v4-pro      # SVG diagrams: pro plans layout/composition far
                                               # better; paired with a 16k token budget so the
                                               # SVG fits after reasoning (6k starved it once)
  diagram_fallback: deepseek/deepseek-v4-flash # when pro reasons itself out of budget and
                                               # emits no SVG, flash reliably draws *something*

temperature:
  toc:           0.4
  critic:        0.2
  judge:         0.2   # ranking drafts is a judgment call - low temp for stable, repeatable picks
  verifier:      0.2   # claim checking must be consistent, not creative
  summarizer:    0.0   # canon extraction + chapter summaries: deterministic, no invention
  consolidation: 0.0   # whole-book continuity audit: analytical, must be reproducible (A-022)
  learner:       0.2   # skill distillation: a little room to generalize, but kept low
  humanizer:     0.3   # surgical line edits - low temp; it must not get creative
  writer:        0.9   # explicit base temp; divergent first drafts sample 0.7/1.0/1.2

# Per-node repetition penalties (A-024). A mild positive frequency_penalty on the writer
# attacks token-level repetition - the core slop the humanizer cleans up - at the source.
# Conservative defaults; range is [-2, 2]. Tunable; remove a node to leave it unset.
frequency_penalty:
  writer:     0.3
presence_penalty:
  writer:     0.1
