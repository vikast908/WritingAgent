<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf8f4">
<title>Writing Agent — Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%2317171a'/%3E%3Ctext x='8' y='12.5' font-size='13' text-anchor='middle' fill='%23faf8f4' font-family='Georgia,serif' font-weight='700'%3E%C2%B6%3C/text%3E%3C/svg%3E">
<style>
/* ── Writing Agent design tokens (design.md): editorial — ink on warm paper, one accent
   (manuscript red), a real serif (Fraunces) for display + reading. Flat, borderless, type-led.
   The var names --blue/--blue-2/--coral are kept as the accent-strong/accent/brass slots so the
   whole sheet stays token-driven; strokes & fills derive from the accent via color-mix. */
@font-face{font-family:'Fraunces';font-style:normal;font-weight:300 700;font-display:swap;
  src:url('/static/fonts/fraunces.woff2') format('woff2');font-optical-sizing:auto}
:root{
  /* accent slots (names retained, values editorial): blue-2 = manuscript red (the accent),
     blue = accent-strong (hover/pressed), coral = brass (warm counterpoint, used sparingly) */
  --blue:#872a19; --blue-2:#a3341f; --coral:#b0812f;
  --bg:#faf8f4; --surface:#ffffff; --sidebar:#f2ede4;
  --fg:#17171a; --red:#c23b2b; --green:#2f7d5a; --orange:#a85f1e;
  --accent:var(--blue-2);
  --r-sm:3px;   /* controls: buttons, inputs, chips */
  --r-md:0px;   /* content surfaces / cards: square, page-like */
  --r-lg:6px;   /* overlays: dialogs, popovers, toast */
  --serif:"Fraunces","Iowan Old Style",Charter,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow-page:
    0 .125rem .25rem -.125rem color-mix(in srgb,#000 8%,transparent),
    0 .5rem .75rem -.375rem color-mix(in srgb,#000 7%,transparent),
    0 1.25rem 1.75rem -.875rem color-mix(in srgb,#000 6%,transparent);
  --shadow-card:0 1px 2px color-mix(in srgb,#000 5%,transparent),
    0 0 0 1px color-mix(in srgb,var(--fg) 6%,transparent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#121211; --surface:#1c1b19; --sidebar:#0e0e0d; --fg:#f3efe6;
  --blue:#b8462f; --blue-2:#d8664c; --coral:#cda24e;
  --red:#e0604e; --green:#5aa07f; --orange:#d08a3a;
  --shadow-card:0 1px 2px color-mix(in srgb,#000 40%,transparent),
    0 0 0 1px color-mix(in srgb,var(--fg) 9%,transparent);
}}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1c1b19; --sidebar:#0e0e0d; --fg:#f3efe6;
  --blue:#b8462f; --blue-2:#d8664c; --coral:#cda24e;
  --red:#e0604e; --green:#5aa07f; --orange:#d08a3a;
  --shadow-card:0 1px 2px color-mix(in srgb,#000 40%,transparent),
    0 0 0 1px color-mix(in srgb,var(--fg) 9%,transparent);
}
:root{
  --stroke:color-mix(in srgb, var(--accent) 16%, color-mix(in srgb, var(--fg) 7%, transparent));
  --stroke-soft:color-mix(in srgb, var(--fg) 8%, transparent);
  --hair:color-mix(in srgb, var(--fg) 10%, transparent);
  --fill:color-mix(in srgb, var(--accent) 8%, transparent);
  --fill-2:color-mix(in srgb, var(--accent) 5%, transparent);
  --fg-2:color-mix(in srgb, var(--fg) 72%, transparent);
  --fg-3:color-mix(in srgb, var(--fg) 60%, transparent);
  --fg-4:color-mix(in srgb, var(--fg) 34%, transparent);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13.5px;line-height:1.55;
  display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}

/* controls */
button{font:inherit;font-size:12.5px;color:var(--fg);background:transparent;border:none;
  border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast),transform 160ms var(--ease-out)}
button:hover{background:var(--fill)}
button:active:not(:disabled){transform:scale(.97)}   /* the press answers instantly */
button.primary{background:var(--accent-fill);color:var(--on-accent)}
button.primary:hover{background:var(--accent-fill-hover)}
button.secondary{background:var(--fill);color:var(--accent)}
button.text{padding:4px 6px;color:var(--accent)}
button.text:hover{background:transparent;text-decoration:underline}
button.danger{color:var(--red)}
button.danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);
  border:1px solid var(--stroke-soft);border-radius:var(--r-sm);padding:7px 10px;
  box-shadow:inset 0 1px 1px color-mix(in srgb,#000 6%,transparent)}
input:hover,select:hover,textarea:hover{border-color:var(--stroke)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;resize:vertical;min-height:64px}
select{cursor:pointer}
/* segmented control */
.seg{display:inline-flex;background:var(--fill-2);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{padding:5px 12px;font-size:12px;color:var(--fg-3);border-radius:calc(var(--r-sm) - 1px)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px color-mix(in srgb,#000 8%,transparent)}
.seg button:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}

.kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right}
.muted{color:var(--fg-3)} .small{font-size:12px}
h1,h2,h3{font-family:var(--serif);font-weight:540;letter-spacing:-.01em}

/* themed scrollbars everywhere (native ones broke the look) */
*{scrollbar-width:thin;scrollbar-color:var(--stroke-soft) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--stroke-soft);border-radius:9999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--stroke)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* custom select — native <select> option popups can't be themed, so we render our own */
.csel{position:relative;display:inline-block;vertical-align:middle}
.csel-btn{display:inline-flex;align-items:center;gap:9px;justify-content:space-between;width:100%;
  background:var(--surface);border:1px solid var(--stroke-soft);border-radius:var(--r-sm);
  padding:7px 10px;min-width:130px;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;
  box-shadow:inset 0 1px 1px color-mix(in srgb,#000 6%,transparent);transition:border-color var(--dur-fast)}
.csel-btn:hover{border-color:var(--stroke)}
.csel.open .csel-btn{border-color:var(--accent)}
.csel-btn .csel-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csel-btn .chev{color:var(--fg-3);font-size:9px;transition:transform var(--dur-fast)}
.csel.open .csel-btn .chev{transform:rotate(180deg)}
.csel-menu{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;z-index:var(--z-dropdown);
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-page),0 0 0 1px var(--hair);
  padding:4px;max-height:280px;overflow:auto;display:none}
.csel.open .csel-menu{display:block;transform-origin:top;animation:menupop .12s var(--ease-out)}
.csel.up .csel-menu{top:auto;bottom:calc(100% + 4px)}
.csel.up.open .csel-menu{transform-origin:bottom}
.csel.rt .csel-menu{left:auto;right:0}
.csel-opt{padding:6px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;white-space:nowrap;color:var(--fg-2);
  display:flex;align-items:center;gap:8px}
.csel-opt:hover{background:var(--fill)}
.csel-opt.on{color:var(--accent);font-weight:500}
.csel-opt.on::before{content:'✓';font-size:10px}
.csel-opt:not(.on)::before{content:'';width:10px}

/* layout */
#side{width:216px;min-width:216px;background:var(--sidebar);display:flex;flex-direction:column;
  border-right:1px solid var(--hair);transition:width var(--dur-base) var(--ease-out),min-width var(--dur-base) var(--ease-out)}
#sideToggle{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border-radius:var(--r-sm);color:var(--fg-3);flex:none;margin-left:-4px}
#sideToggle:hover{background:var(--fill-2);color:var(--fg)}
/* collapsed sidebar (manual toggle) → icon rail; same visual as the narrow-screen rail */
body.side-collapsed #side{width:56px;min-width:56px}
body.side-collapsed .brand{padding:16px 0 12px;text-align:center}
body.side-collapsed .brand .mark{justify-content:center;gap:0}
body.side-collapsed .brand .wm,body.side-collapsed .brand .sub{display:none}
body.side-collapsed #nav{padding:6px 8px}
body.side-collapsed #nav .item{justify-content:center;padding:9px 0;gap:0}
body.side-collapsed #nav .nlbl{display:none}
body.side-collapsed .foot{display:none}
.brand{padding:20px 20px 16px}
.brand .mark{display:inline-flex;align-items:center;gap:9px}
.brand .sq{width:24px;height:24px;border-radius:var(--r-sm);background:#17171a;color:#faf8f4;
  display:grid;place-items:center;font-family:var(--serif);font-weight:500;font-size:16px;line-height:1}
.brand .wm{font-family:var(--serif);font-weight:520;font-size:17px;letter-spacing:0}
.brand .sub{margin-top:6px;font-size:11px}
#nav{flex:1;padding:6px 10px}
#nav .item{display:flex;width:100%;text-align:left;align-items:center;gap:10px;padding:8px 11px;border-radius:var(--r-sm);
  cursor:pointer;color:var(--fg-2);font-size:13px;margin-bottom:1px}
#nav .item:hover{background:var(--fill-2)}
#nav .item.on{background:var(--fill);color:var(--accent);font-weight:500}
#nav .item .ic{width:15px;text-align:center;opacity:.8;font-family:var(--mono);font-size:12px}
.foot{padding:12px 20px;border-top:1px solid var(--hair);font-family:var(--mono);font-size:11px;color:var(--fg-3);line-height:1.7}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:50px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--hair)}
#crumb{font-size:12px;color:var(--fg-3)}
#topbar .spacer{flex:1}
#view{flex:1;overflow:auto;padding:24px 26px 60px}
#view>*{max-width:768px;margin:0}   /* one focused 768px column, left-aligned to the page inset */
#view::-webkit-scrollbar,#log::-webkit-scrollbar{width:9px}
#view::-webkit-scrollbar-thumb,#log::-webkit-scrollbar-thumb{background:var(--stroke-soft);border-radius:5px}

/* page head: flat, hairline under (no boxes) */
.head{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--hair)}
.head .kicker{margin-bottom:6px}
.head h2{font-size:23px;font-weight:600}
.head .desc{color:var(--fg-3);margin-top:5px;font-size:13px}

/* section: grouped by whitespace + a single hairline label, not a card */
.section{margin-bottom:26px}
.section>.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);
  font-weight:600;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--hair)}
/* elevated surface only where a real card is warranted (composer, log, overlays) */
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:16px 18px}

/* metric strip: flat cells, hairline dividers */
.metrics{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--hair);border-radius:var(--r-md);overflow:hidden}
.metrics .cell{flex:1;min-width:135px;padding:13px 16px;border-right:1px solid var(--hair)}
.metrics .cell:last-child{border-right:none}
.metrics .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.metrics .v{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
.metrics .v.blue{color:var(--accent)}
.metrics .sub{font-family:var(--mono);font-size:11px;color:var(--fg-3);margin-top:1px}

/* tables: borderless, hairline rows */
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);
  font-weight:500;padding:7px 11px;border-bottom:1px solid var(--hair)}
td{padding:7px 11px;border-bottom:1px solid var(--hair);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover td,table tr:hover td{background:var(--fill-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.click{cursor:pointer}

/* chips / pills */
.chip{display:inline-block;padding:1px 8px;border-radius:var(--r-sm);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.03em;color:var(--fg-3);background:var(--fill-2);margin-right:5px;white-space:nowrap}
.chip.blue{color:var(--accent);background:var(--fill)}
.chip.ok{color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.chip.err{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.chip.warn{color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,transparent)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* studio approach picker */
.approach{cursor:pointer;padding:13px 15px;border-radius:var(--r-md);border:1px solid var(--hair);margin-bottom:9px;transition:border-color var(--dur-fast),background var(--dur-fast)}
.approach:hover{border-color:var(--stroke)}
.approach.sel{border-color:var(--accent);background:var(--fill-2)}
.approach .t{font-weight:600;font-size:14.5px;margin-bottom:3px}
.approach .t .n{color:var(--accent);margin-right:6px}
.approach .s{color:var(--fg-2);font-size:13px}.approach .s.muted{color:var(--fg-3);font-size:12.5px;margin-top:2px}

/* memory manager — forms shouldn't sprawl (shares the global 768px column) */
.memview textarea{min-height:170px}
.tabwrap{margin-bottom:18px}
.hint{margin-bottom:11px}
.memitem{border:1px solid var(--hair);border-radius:var(--r-md);margin-bottom:9px;overflow:hidden;transition:border-color var(--dur-fast)}
.memitem:hover{border-color:var(--stroke)}
.memhead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.memhead .mname{flex:none;font-weight:600;font-size:14px}
.memhead .msum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-3);font-size:12.5px}
.memhead .mstat{flex:none;font-family:var(--mono);font-size:11px;color:var(--fg-3);white-space:nowrap}
.memitem.dim{opacity:.58}
.memitem.dim:hover{opacity:1}
.memhead .chev{color:var(--fg-4);font-size:11px;transition:transform var(--dur-base) var(--ease-out)}
.membody{padding:12px 14px 15px;border-top:1px solid var(--hair)}
.memact{display:flex;align-items:center;gap:10px;margin-top:13px}
.memrow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--hair)}
.memrow:last-of-type{border-bottom:none}
.memrow .mtext{flex:1;font-size:13.5px;color:var(--fg)}
.iconbtn{width:22px;height:22px;border-radius:6px;color:var(--fg-4);font-size:15px;line-height:1;flex:none;transition:color var(--dur-fast),background var(--dur-fast)}
.iconbtn:hover{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.memadd{margin-top:14px}
.memadd input{flex:1}
.memnew{margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}
.memnew input,.memnew textarea{width:100%;margin-bottom:8px}
textarea.mono{font-family:var(--mono);font-size:12px;line-height:1.6}
.memempty{text-align:center;padding:34px 20px;color:var(--fg-3)}
.memempty .t{font-weight:600;color:var(--fg-2);margin-bottom:6px;font-size:14px}
.memempty .s{font-size:13px;max-width:520px;margin:0 auto;line-height:1.55}

/* disclosure — the Studio "Advanced" reveal; grid-rows 0fr→1fr animates height cleanly */
.disc{display:flex;align-items:center;gap:8px;width:100%;margin-top:14px;padding:8px 2px;text-align:left;color:var(--fg-2);font-size:12.5px;font-weight:500}
.disc:hover{color:var(--fg);background:transparent}
.disc .chev{color:var(--fg-4);font-size:10px;transition:transform var(--dur-base) var(--ease-out)}
.disc[aria-expanded="true"] .chev{transform:rotate(90deg)}
.disc .disc-note{margin-left:auto;color:var(--fg-4);font-weight:400;font-size:11.5px}
.disc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-base) var(--ease-out)}
.disc-panel.open{grid-template-rows:1fr}
.disc-inner{overflow:hidden;min-height:0}
.advbody{padding-top:13px}
.advgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:13px}
.advseo{width:100%;margin-top:13px}
@media (max-width:560px){.disc .disc-note{display:none}}
@media (prefers-reduced-motion:reduce){.disc-panel,.disc .chev{transition:none}}

/* studio — centered compose surface: heading + outer card holding the field + actions */
.hero{margin:0;text-align:left;padding-top:clamp(40px,12vh,120px)}
.hero.compact{padding-top:28px}
.hero-h{font-family:var(--serif);font-size:clamp(27px,3.4vw,34px);font-weight:500;letter-spacing:-.01em;line-height:1.1;color:var(--fg);text-wrap:balance}
.hero-sub{color:var(--fg-3);font-size:15px;margin-top:9px}
/* one frame: the card IS the input surface; the field is borderless, actions sit below a hairline */
.composer-card{margin-top:26px;text-align:left;padding:16px 18px;border-radius:16px;
  background:var(--surface);border:1px solid var(--stroke-soft);box-shadow:var(--shadow-card);
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.composer-card:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--fill)}
.composer-field{width:100%;min-height:120px;max-height:340px;resize:none;overflow-y:auto;color:var(--fg);
  background:transparent;border:none;box-shadow:none;
  font-family:var(--sans);font-size:15px;line-height:1.55;padding:2px 0}
.composer-field:hover,.composer-field:focus{border:none;box-shadow:none;outline:none}
.composer-field::placeholder{color:var(--fg-4)}
.composer-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)}
.advtoggle{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9999px;
  background:var(--surface);border:1px solid var(--stroke-soft);color:var(--fg-2);font-size:13px;font-weight:500}
.advtoggle:hover{border-color:var(--stroke);color:var(--fg)}
.advtoggle .ico{flex:none;color:var(--fg-3)}
.advtoggle .chev{font-size:9px;color:var(--fg-4);transition:transform var(--dur-base) var(--ease-out)}
.advtoggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.composer-go{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:10px 20px;border-radius:9px;font-weight:500}
.composer-go .go-arrow{font-size:15px;line-height:1}
.advcard{max-width:768px;margin:14px 0 0;text-align:left;background:var(--surface);
  border:1px solid var(--hair);border-radius:14px;padding:20px 22px}
.advrow{display:flex;gap:16px}
.advfield{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.advcard>.advfield:last-child{margin-bottom:0}
.advrow .advfield{flex:1;margin-bottom:15px}
.advgrid .advfield{margin-bottom:0}
.advlbl{font-size:12.5px;color:var(--fg-2);font-weight:500}
.advlbl .muted{font-weight:400;font-size:11px}
.advfield input,.advfield textarea,.advfield .csel{width:100%}
.advnote{text-align:center;color:var(--fg-4);font-size:11.5px;margin-top:2px}

/* live log */
#log{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-card);
  padding:13px 15px;font-family:var(--mono);font-size:12px;line-height:1.6;height:360px;overflow:auto;white-space:pre-wrap;color:var(--fg-2)}
.bar{height:5px;background:var(--fill-2);border-radius:9999px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;width:100%;background:var(--blue-2);transform-origin:left;transition:transform var(--dur-slow) var(--ease-out)}

/* live-run: pipeline stepper + the "now" activity line (design.md: show the agent thinking) */
.pipe{display:flex;align-items:center;margin:2px 0 16px;flex-wrap:wrap;row-gap:8px}
.pipe .step{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-3);white-space:nowrap}
.pipe .step .dot{width:9px;height:9px;border-radius:50%;background:var(--fill);box-shadow:inset 0 0 0 1.5px var(--fg-4);flex:none;transition:background .2s var(--ease-out)}
.pipe .step.done{color:var(--fg-2)}
.pipe .step.done .dot{background:var(--green);box-shadow:none}
.pipe .step.on{color:var(--accent);font-weight:600}
.pipe .step.on .dot{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);animation:pulse 1.3s infinite}
.pipe .link{flex:1;min-width:14px;height:1.5px;background:var(--hair);margin:0 9px}
.pipe .link.done{background:var(--green)}
.nowline{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r-md);background:var(--fill-2);margin-bottom:12px}
.nowline .spin{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 24%,transparent);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none}
.nowline.idle .spin{animation:none;border-top-color:color-mix(in srgb,var(--accent) 24%,transparent)}
.nowline.ok .spin{border:2px solid var(--green);animation:none}
.nowline .lbl2{font-size:13.5px;color:var(--fg);font-weight:500}
.nowline .sub2{font-size:11.5px;color:var(--fg-3)}
@keyframes spin{to{transform:rotate(360deg)}}

/* activity timeline */
.tl{border-left:1.5px solid var(--stroke);margin-left:5px;padding-left:20px}
.tl .ev{position:relative;margin-bottom:15px}
.tl .ev::before{content:'';position:absolute;left:-25px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:1.5px solid var(--fg-4)}
.tl .ev.act::before{border-color:var(--blue-2);background:var(--blue-2)}
.tl .ev.res::before{border-color:var(--coral);background:var(--coral)}
.tl .ev.good::before{border-color:var(--green);background:var(--green)}
.tl .ev.bad::before{border-color:var(--red);background:var(--red)}
.tl .when{font-family:var(--mono);font-size:10.5px;color:var(--fg-3)}
.tl .body{font-size:13.5px;margin-top:2px}

/* charts */
svg.spark{display:block}.axt{font-family:var(--mono);font-size:9.5px;fill:var(--fg-3)}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:11px;font-size:12.5px}
.hbar .hbar-l{font-family:var(--mono);font-size:11px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .hbar-track{height:8px;background:var(--fill-2);border-radius:9999px;overflow:hidden}
.hbar .hbar-track i{display:block;height:100%;background:var(--blue-2);border-radius:9999px}
.hbar .hbar-v{font-family:var(--mono);font-size:11px;text-align:right;color:var(--fg-3)}
.legend{display:flex;gap:15px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);margin-top:8px}
.legend span::before{content:'';display:inline-block;width:9px;height:2px;margin-right:6px;vertical-align:middle;background:currentColor}

/* rendered markdown */
.md{font-family:var(--serif);font-size:16px;line-height:1.62;max-width:66ch;margin-inline:auto}
.md.read>p:first-of-type::first-letter{float:left;font-family:var(--serif);font-size:3.1em;line-height:.82;font-weight:560;padding:.04em .1em 0 0;color:var(--accent)}
.md h1{font-size:22px;margin:16px 0 8px}.md h2{font-size:18px;margin:16px 0 8px;color:var(--fg)}.md h3{font-size:15px;margin:12px 0 6px}
.md p{margin:8px 0}.md li{margin:3px 0 3px 20px}
.md code{font-family:var(--mono);font-size:12px;background:color-mix(in srgb,var(--fg) 6%,transparent);padding:1px 5px;border-radius:var(--r-sm)}
.md pre{background:var(--surface);box-shadow:var(--shadow-card);border-radius:var(--r-md);padding:13px;overflow:auto;margin:11px 0}
.md pre code{background:none;padding:0}
.md blockquote{border-left:2px solid var(--accent);padding-left:12px;color:var(--fg-2);margin:9px 0}
.md hr{border:none;border-top:1px solid var(--hair);margin:16px 0}
.md img,.svgwrap svg{max-width:100%;height:auto}
.svgwrap{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:12px;margin:8px 0}

.settingrow{display:flex;align-items:flex-start;gap:24px;padding:13px 0;border-bottom:1px solid var(--hair)}
.setmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.setmeta label{font-size:13.5px;color:var(--fg);font-weight:500}
.setdesc{font-size:12px;color:var(--fg-3);line-height:1.45;max-width:62ch}
.setctl{flex:none;width:230px;padding-top:1px}
.setctl input,.setctl .csel{width:100%}
.imgrow .imgchips{margin-top:9px}
.imgchips{display:flex;flex-wrap:wrap;gap:6px}
.imgchip{padding:5px 12px;border:1px solid var(--hair);border-radius:9999px;font-family:var(--mono);font-size:11.5px;color:var(--fg-3);background:transparent;transition:color var(--dur-fast),border-color var(--dur-fast),background var(--dur-fast)}
.imgchip:hover{border-color:var(--stroke);color:var(--fg-2)}
.imgchip.on{border-color:var(--accent);color:var(--accent);background:var(--fill)}
.imgchip:active{transform:scale(.97)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:880px){.grid2{grid-template-columns:1fr}}

/* native number spinners kept (design system §Inputs: discoverable + keyboard-operable) */

/* wide content scrolls in its own container (design.md: never break the page) */
.scroll-x{overflow-x:auto;max-width:100%}
/* markdown tables (design.md known gap: were showing raw pipes) — sans, hairline rows, scroll if wide */
.mdtable{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:13px;margin:2px 0}
.mdtable th,.mdtable td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
.mdtable th{font-weight:600;color:var(--fg-2);white-space:nowrap}
.mdtable tbody tr:last-child td{border-bottom:none}

/* responsive: collapse the sidebar to an icon rail below the md breakpoint (design.md §Layout) */
@media(max-width:880px){
  #side{width:56px;min-width:56px}
  .brand{padding:16px 0 12px;text-align:center}
  .brand .mark{justify-content:center;gap:0}
  .brand .wm,.brand .sub{display:none}
  #nav{padding:6px 8px}
  #nav .item{justify-content:center;padding:9px 0;gap:0}
  #nav .nlbl{display:none}
  .foot{display:none}
  #view{padding:20px 16px 48px}
  #topbar{padding:0 16px}
}

/* keyboard-highlighted option in a custom select */
.csel-opt.hl{background:var(--fill)}

/* loading indicator — the Caret (design.md: a writer's blinking cursor, never the word "Loading…") */
.loading{display:inline-flex;gap:8px;align-items:baseline;color:var(--fg-3);font-size:13px;font-family:var(--serif)}
.loading .caret{font-family:var(--mono);color:var(--accent);font-weight:700;animation:caret 1.05s step-end infinite}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}

/* modal overlay (design.md: shadow-nous + hairline, Esc + × to close) */
.scrim{position:fixed;inset:0;z-index:var(--z-scrim);background:color-mix(in srgb,#000 32%,transparent);
  display:grid;place-items:center;animation:fade .12s ease-out}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-page),0 0 0 1px var(--hair);
  padding:20px 22px;max-width:440px;width:calc(100% - 40px);animation:pop .14s ease-out}
.modal h3{font-size:16px;margin-bottom:8px}
.modal .m-body{color:var(--fg-2);font-size:13.5px;margin-bottom:14px}
.modal .m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.modal .x{position:absolute}
/* copy affordance on artifact / promo views */
.copybar{display:flex;justify-content:flex-end;margin-bottom:8px}

.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border-radius:var(--r-lg);
  transition:opacity .15s var(--ease-out),transform .15s var(--ease-out);
  box-shadow:var(--shadow-page),0 0 0 1px var(--hair);padding:11px 16px;z-index:var(--z-overlay);max-width:440px;font-size:13.5px;animation:pop .16s ease-out}
.toast.err{color:var(--red)}
.toast.out{opacity:0;transform:translateY(8px)}
#runbadge{display:none;align-items:center;gap:8px;padding:4px 12px;border-radius:9999px;background:var(--fill);
  cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--accent)}
#runbadge .dot{width:7px;height:7px;border-radius:50%;background:var(--blue-2);animation:pulse 1.3s infinite}
#themeSelWrap .csel-btn{min-width:104px;font-size:12px;padding:5px 9px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes menupop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#view.vt>*{animation:fade .18s var(--ease-out)}   /* .vt is set only on view changes */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .loading .caret{animation:caret 1.05s step-end infinite!important}  /* comprehension aid: opacity-only, 1Hz */
  #runbadge .dot{animation:none!important}
}

/* ── design.md conformance: semantic tokens, notifications, states, tooltip ── */
:root{
  --info:#3f6f78; --on-accent:#faf8f4;
  --accent-fill:var(--blue-2); --accent-fill-hover:var(--blue);
  --border:var(--stroke); --border-strong:color-mix(in srgb,var(--accent) 26%,color-mix(in srgb,var(--fg) 14%,transparent));
  --focus-ring:var(--accent);
  --dur-fast:120ms; --dur-base:180ms; --dur-slow:300ms; --ease-out:cubic-bezier(.16,1,.3,1);
  --z-dropdown:200; --z-overlay:300; --z-scrim:400; --z-modal:401; --z-tooltip:500;
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--info:#5a97a2;--accent-fill:var(--blue);--accent-fill-hover:#993a26}}
:root[data-theme="dark"]{--info:#5a97a2;--accent-fill:var(--blue);--accent-fill-hover:#993a26}
/* banners — persistent in-flow notifications (10% tint + 3px accent bar + icon) */
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;margin:0 0 14px;
  background:color-mix(in srgb,var(--bnc,var(--info)) 12%,transparent);
  font-size:13px;color:var(--fg-2);border-radius:var(--r-sm)}
.banner .bi{color:var(--bnc,var(--info));font-weight:700;line-height:1.5;flex:none}
.banner.info{--bnc:var(--info)} .banner.success{--bnc:var(--green)}
.banner.warning{--bnc:var(--orange)} .banner.error{--bnc:var(--red)}
/* field error state (error border + helper; color is never the only signal) */
input.err,textarea.err,.csel.err .csel-btn{border-color:var(--red)!important}
.field-err{display:flex;gap:5px;align-items:center;color:var(--red);font-size:11.5px;margin-top:4px}
.field-err::before{content:'!';display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;
  background:var(--red);color:#fff;font-size:9px;font-weight:700;flex:none}
/* themed tooltip (replaces native title=; ink fill, paper text) */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);
  left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-family:var(--sans);font-size:11px;
  line-height:1.3;width:max-content;max-width:260px;white-space:normal;padding:4px 8px;border-radius:var(--r-sm);
  box-shadow:var(--shadow-page);z-index:var(--z-tooltip);pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .12s var(--ease-out) 0s,visibility 0s linear .12s}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;visibility:visible;transition-delay:.3s,.3s}
</style>

<body>
<aside id="side">
  <div class="brand">
    <div class="mark"><span class="sq">¶</span><span class="wm">Writing Agent</span></div>
    <div class="kicker sub">Studio · local</div>
  </div>
  <nav id="nav"></nav>
  <div class="foot"><span id="userTag"></span><br>127.0.0.1 · local · private</div>
</aside>
<main id="main">
  <div id="topbar">
    <button id="sideToggle" data-tip="Toggle sidebar" aria-label="Toggle sidebar" onclick="toggleSide()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></button>
    <span id="crumb"></span><span class="spacer"></span>
    <div id="runbadge" role="button" tabindex="0" aria-label="a run is live — open Live run" onclick="go('run')"><span class="dot"></span><span id="runbadgeTxt">running</span></div>
    <span id="themeSelWrap" data-tip="appearance"></span>
  </div>
  <div id="view"></div>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt$=c=>'$'+(+c||0).toFixed(4);
const fmtK=t=>{t=+t||0;return t>=1e6?(t/1e6).toFixed(2)+'M':t>=1e3?(t/1e3).toFixed(1)+'k':''+Math.round(t)};
async function api(path,body){
  const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||r.statusText);
  return d;
}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;
  t.setAttribute('role',err?'alert':'status');
  document.body.appendChild(t);
  setTimeout(()=>{t.classList.add('out');t.addEventListener('transitionend',()=>t.remove(),{once:true});
    setTimeout(()=>t.remove(),240);},err?6000:3200);}   // exit is faster than entry; fallback removal for reduced-motion
/* banner — persistent in-flow notification (design.md Notifications). kind: info|success|warning|error */
const banner=(kind,html)=>`<div class="banner ${kind}"><span class="bi">${({info:'ⓘ',success:'✓',warning:'▲',error:'✕'}[kind])||'ⓘ'}</span><div>${html}</div></div>`;
const loadingHTML=()=>'<span class="loading"><span class="caret">▍</span></span>';
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('copied to clipboard');}
  catch(_){toast('copy failed — select the text manually',1);}}
/* styled confirm dialog (replaces the native prompt/confirm, which breaks the theme).
   requireText: when set, the user must type it exactly (type-to-confirm for destructive acts). */
function confirmModal({title,body='',confirmLabel='Confirm',danger=false,requireText=null}){
  return new Promise(resolve=>{
    const scrim=document.createElement('div');scrim.className='scrim';
    scrim.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3><div class="m-body">${body}</div>
      ${requireText!=null?'<input id="m-inp" autocomplete="off" placeholder="type to confirm">':''}
      <div class="m-actions"><button class="text" data-act="cancel">Cancel</button>
        <button class="${danger?'danger':'primary'}" data-act="ok" ${requireText!=null?'disabled':''}>${esc(confirmLabel)}</button></div></div>`;
    document.body.appendChild(scrim);
    const ok=scrim.querySelector('[data-act=ok]'),inp=scrim.querySelector('#m-inp');
    const prevFocus=document.activeElement;
    const close=v=>{scrim.remove();document.removeEventListener('keydown',onkey);if(prevFocus&&prevFocus.focus)prevFocus.focus();resolve(v);};
    const foc=()=>[...scrim.querySelectorAll('button,input,[tabindex]:not([tabindex="-1"])')].filter(e=>!e.disabled&&e.offsetParent!==null);
    const onkey=e=>{
      if(e.key==='Escape')return close(false);
      if(e.key==='Enter'&&!ok.disabled)return close(true);
      if(e.key==='Tab'){const f=foc();if(!f.length)return;const a=f[0],z=f[f.length-1];
        if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
        else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
    };
    if(inp){inp.focus();inp.addEventListener('input',()=>{ok.disabled=inp.value!==requireText;});}else ok.focus();
    scrim.addEventListener('click',e=>{if(e.target===scrim)return close(false);
      const a=e.target.closest('[data-act]');if(a)close(a.dataset.act==='ok');});
    document.addEventListener('keydown',onkey);
  });
}
function md(src){
  const lines=String(src||'').split('\n');let out=[],inList=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const cl=()=>{if(inList){out.push('</ul>');inList=false;}};
  const isSep=s=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(s);   // | --- | --- |
  const cells=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  for(let i=0;i<lines.length;i++){
    const ln=lines[i];
    if(ln.trim().startsWith('```')){cl();const body=[];i++;
      while(i<lines.length&&!lines[i].trim().startsWith('```')){body.push(esc(lines[i]));i++;}
      out.push('<pre><code>'+body.join('\n')+'\n</code></pre>');continue;}
    // GFM table: a pipe row immediately followed by a |---|---| separator
    if(ln.includes('|')&&i+1<lines.length&&isSep(lines[i+1])){
      cl();const head=cells(ln);i++;const rows=[];
      while(i+1<lines.length&&lines[i+1].includes('|')&&lines[i+1].trim()){rows.push(cells(lines[i+1]));i++;}
      out.push('<div class="scroll-x"><table class="mdtable"><thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>'
        +rows.map(r=>'<tr>'+head.map((_,j)=>`<td>${inline(r[j]||'')}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');continue;}
    const h=ln.match(/^(#{1,4}) (.*)/);
    if(h){cl();out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);continue;}
    if(/^\s*[-*] /.test(ln)||/^\s*\d+\. /.test(ln)){if(!inList){out.push('<ul>');inList=true;}out.push('<li>'+inline(ln.replace(/^\s*(?:[-*]|\d+\.) /,''))+'</li>');continue;}
    cl();
    if(/^\s*---+\s*$/.test(ln)){out.push('<hr>');continue;}
    if(/^> /.test(ln)){out.push('<blockquote>'+inline(ln.slice(2))+'</blockquote>');continue;}
    out.push(ln.trim()?'<p>'+inline(ln)+'</p>':'');
  }
  if(inList)out.push('</ul>');
  return out.join('');
}
/* charts */
function spark(vals,{w=150,h=34,pad=3}={}){
  vals=(vals||[]).filter(v=>typeof v==='number');if(vals.length<2)return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const X=i=>pad+i*(w-2*pad)/(vals.length-1),Y=v=>h-pad-((v-mn)/rng)*(h-2*pad);
  const line=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none">
    <polygon points="${pad},${h-pad} ${line} ${w-pad},${h-pad}" fill="var(--blue-2)" opacity=".13"/>
    <polyline points="${line}" fill="none" stroke="var(--blue-2)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function hbars(rows){
  rows=(rows||[]).filter(r=>r.val>0);if(!rows.length)return '<div class="muted small">no data yet</div>';
  const mx=Math.max(...rows.map(r=>r.val))||1;
  return '<div class="hbars">'+rows.map(r=>`<div class="hbar"><div class="hbar-l" data-tip="${esc(r.label)}">${esc(r.label)}</div>
    <div class="hbar-track"><i style="width:${Math.max(2,100*r.val/mx).toFixed(1)}%"></i></div>
    <div class="hbar-v">${esc(r.sub||'')}</div></div>`).join('')+'</div>';
}
function trend(series,{w=340,h=128,pad=18}={}){
  series=(series||[]).filter(s=>s.points.length);
  const n=Math.max(0,...series.map(s=>s.points.length));
  if(!n)return '<div class="muted small">no scores yet</div>';
  const X=i=>pad+(n>1?i*(w-2*pad)/(n-1):(w-2*pad)/2),Y=v=>h-pad-((v-1)/4)*(h-2*pad);
  let grid='';for(let g=1;g<=5;g++){const y=Y(g).toFixed(1);
    grid+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="var(--hair)" stroke-width="1"/><text x="3" y="${(+y+3)}" class="axt">${g}</text>`;}
  const col={insight:'var(--blue-2)',clarity:'var(--info)',structure:'var(--green)',evidence:'var(--orange)'};
  const paths=series.map(s=>{const c=col[s.key]||'var(--fg-3)';
    const pts=s.points.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.7" vector-effect="non-scaling-stroke"/>`
      +s.points.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.3" fill="${c}"/>`).join('');}).join('');
  const leg='<div class="legend">'+series.map(s=>`<span style="color:${col[s.key]||'var(--fg-3)'}">${s.key}</span>`).join('')+'</div>';
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${grid}${paths}</svg>${leg}`;
}
/* custom select — one styled dropdown everywhere (native option popups aren't themeable).
   Delegation is attached once at boot, so it survives view re-renders. */
const CSEL={};   // id -> onChange(value)
function sel(id,options,current,{none=null,cb=null}={}){
  if(cb)CSEL[id]=cb;
  let opts=(options||[]).map(o=>typeof o==='string'?{value:o,label:o}:o);
  if(none!==null)opts=[{value:'',label:none},...opts];
  const cur=opts.find(o=>o.value===(current??''))||opts[0]||{value:'',label:''};
  const menu=opts.map(o=>`<div class="csel-opt ${o.value===cur.value?'on':''}" role="option" aria-selected="${o.value===cur.value}" data-cselopt="${id}" data-val="${esc(o.value)}">${esc(o.label)}</div>`).join('');
  return `<div class="csel" id="${id}" data-value="${esc(cur.value)}">
    <button type="button" class="csel-btn" data-csel="${id}" aria-haspopup="listbox" aria-expanded="false"><span class="csel-lbl">${esc(cur.label)}</span><span class="chev">▼</span></button>
    <div class="csel-menu" role="listbox">${menu}</div></div>`;
}
function selVal(id){const e=document.getElementById(id);return e?(e.dataset.value||''):'';}
function ctrlVal(id){const e=document.getElementById(id);if(!e)return'';return e.classList.contains('csel')?(e.dataset.value||''):e.value;}
function cselClose(){document.querySelectorAll('.csel.open').forEach(x=>{
  x.classList.remove('open','up','rt');x.querySelector('.csel-btn').setAttribute('aria-expanded','false');
  x.querySelectorAll('.csel-opt.hl').forEach(o=>o.classList.remove('hl'));});}
function cselFlip(c){const menu=c.querySelector('.csel-menu');if(!menu)return;   // keep the menu on-screen
  const r=c.getBoundingClientRect(),mh=menu.offsetHeight,mw=menu.offsetWidth,below=innerHeight-r.bottom,above=r.top;
  c.classList.toggle('up',below<mh+16&&above>below);        // flip up when there's no room below
  c.classList.toggle('rt',r.left+mw>innerWidth-8);}          // right-align when it would overflow the right edge
function cselPick(opt){const id=opt.dataset.cselopt,c=document.getElementById(id);
  c.dataset.value=opt.dataset.val;c.querySelector('.csel-lbl').textContent=opt.textContent;
  c.querySelectorAll('.csel-opt').forEach(x=>{x.classList.toggle('on',x===opt);x.setAttribute('aria-selected',x===opt);});
  cselClose();c.querySelector('.csel-btn').focus();if(CSEL[id])CSEL[id](opt.dataset.val);}
document.addEventListener('click',e=>{
  const btn=e.target.closest('.csel-btn'),opt=e.target.closest('.csel-opt');
  if(btn){const c=btn.parentElement,wasOpen=c.classList.contains('open');cselClose();
    if(!wasOpen){c.classList.add('open');btn.setAttribute('aria-expanded','true');cselFlip(c);
      const on=c.querySelector('.csel-opt.on')||c.querySelector('.csel-opt');if(on)on.classList.add('hl');}
    return;}

});
let _gAt=0;   // g-then-key view nav (g s/p/r/t/k/,) - never inside a field
document.addEventListener('keydown',e=>{
  const tg=(e.target.tagName||'').toLowerCase();
  if(tg!=='input'&&tg!=='textarea'&&tg!=='select'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(e.key==='g'){_gAt=Date.now();}
    else if(_gAt&&Date.now()-_gAt<900){const m={s:'studio',p:'projects',r:'run',t:'telemetry',k:'memory',m:'memory',',':'settings'};
      if(m[e.key]){go(m[e.key]);e.preventDefault();}_gAt=0;}
  }
  if((e.key==='Enter'||e.key===' ')&&e.target instanceof Element&&e.target.hasAttribute('data-kb')){
    e.preventDefault();e.target.click();return;}   // keyboard-activate rows/cards (design.md: no mouse required)
  const open=document.querySelector('.csel.open');
  if(!open){return;}
  const opts=[...open.querySelectorAll('.csel-opt')];let i=opts.findIndex(o=>o.classList.contains('hl'));
  if(e.key==='Escape'){cselClose();open.querySelector('.csel-btn').focus();e.preventDefault();}
  else if(e.key==='ArrowDown'){i=Math.min(opts.length-1,i+1);opts.forEach(o=>o.classList.remove('hl'));opts[i].classList.add('hl');opts[i].scrollIntoView({block:'nearest'});e.preventDefault();}
  else if(e.key==='ArrowUp'){i=Math.max(0,i-1);opts.forEach(o=>o.classList.remove('hl'));opts[i].classList.add('hl');opts[i].scrollIntoView({block:'nearest'});e.preventDefault();}
  else if(e.key==='Enter'&&i>=0){cselPick(opts[i]);e.preventDefault();}

/* themes: System (auto) / Light / Dark (ink + manuscript red) + the shared named palettes
   (the same catalog the TUI uses, sent as S.themes). A named theme recolors the current
   flat editorial layout — same structure, different hue — deriving the full token set from the
   palette's 9 colors, with a per-theme dark background tinted from its structural RULE hue. */
const TVARS=['--bg','--surface','--sidebar','--fg','--accent','--blue','--blue-2','--coral','--ok','--err','--orange','--red',
             '--accent-fill','--accent-fill-hover','--on-accent'];
function _lum(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));
  return .2126*v[0]+.7152*v[1]+.0722*v[2];}
function _cr(a,b){const x=_lum(a),y=_lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function _mixHex(a,b,t){a=a.replace('#','');b=b.replace('#','');
  const c=i=>Math.round(parseInt(a.substr(i,2),16)*(1-t)+parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0');
  return '#'+c(0)+c(2)+c(4);}
// A deliberate display-font stack per theme (system-available, nothing to download), so
// EVERY theme changes its TYPOGRAPHY as well as its colour, each fitting the palette's mood.
const _THEME_FONTS={
  editorial:`"Fraunces","Iowan Old Style",Charter,Georgia,serif`,          // literary serif (default)
  highcontrast:`"Inter","Segoe UI",system-ui,-apple-system,sans-serif`,     // maximally legible sans
  kazama:`"JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,monospace`, // hot, technical mono
  supabase:`"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif`,  // modern dev-tool sans
  'violet-bloom':`"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif`, // elegant serif
  't3-chat':`"Trebuchet MS","Segoe UI",system-ui,sans-serif`,               // friendly humanist sans
  'starry-night':`Georgia,"Times New Roman",Times,serif`,                   // painterly classic serif
  vercel:`"Inter","Segoe UI",system-ui,-apple-system,sans-serif`,           // minimal geometric sans
  fallout:`"JetBrains Mono","Cascadia Code",ui-monospace,Consolas,monospace`, // retro terminal mono
  mimi:`"Trebuchet MS","Segoe UI",Verdana,sans-serif`,                      // soft rounded sans
  astrovista:`"Iowan Old Style","Palatino Linotype",Palatino,serif`};       // cosmic serif
const _DEFAULT_FONT=`"Fraunces","Iowan Old Style",Charter,Georgia,serif`;
function _themeFont(name){return _THEME_FONTS[name]||_DEFAULT_FONT;}
function applyWebTheme(id){
  const h=document.documentElement,r=h.style;
  TVARS.forEach(v=>r.removeProperty(v));r.removeProperty('--serif');   // reset colour + font to the CSS default
  if(id==='light')h.setAttribute('data-theme','light');
  else if(id==='dark')h.setAttribute('data-theme','dark');
  else if(id&&id.startsWith('theme:')){
    h.setAttribute('data-theme','dark');
    const name=id.slice(6),p=(S.themes||{})[name];
    r.setProperty('--serif',_themeFont(name));   // theme changes the display/reading font too
    if(p){const set=(k,v)=>{if(v)r.setProperty(k,v);};
      set('--fg',p.parch);
      set('--accent',p.gold_hi||p.gold);set('--blue-2',p.gold_hi||p.gold);set('--blue',p.gold);
      set('--coral',p.ink);set('--ok',p.on_clr);set('--err',p.err);set('--red',p.err);set('--orange',p.ink);
      const rule=p.rule||'#333';
      set('--bg',`color-mix(in srgb, ${rule} 15%, #07070a)`);
      set('--surface',`color-mix(in srgb, ${rule} 24%, #101016)`);
      set('--sidebar',`color-mix(in srgb, ${rule} 10%, #050507)`);
      /* theming contract (design.md): the primary-button label must stay readable on ANY palette */
      let fill=p.gold_hi||p.gold||'#a3341f';
      let txt=_cr(fill,'#101010')>=_cr(fill,'#faf8f4')?'#101010':'#faf8f4';
      for(let i=0;i<6&&_cr(fill,txt)<4.5;i++)fill=_mixHex(fill,txt==='#faf8f4'?'#000000':'#ffffff',.15);
      set('--accent-fill',fill);set('--on-accent',txt);
      set('--accent-fill-hover',_mixHex(fill,txt==='#faf8f4'?'#000000':'#ffffff',.14));
    }
  }else h.removeAttribute('data-theme');   // system (auto light/dark)
  localStorage.setItem('wa-theme',id);
}
function onWebThemePick(id){
  applyWebTheme(id);
  // Keep the shared `theme` setting in sync when a NAMED palette is chosen, so the web
  // dashboard and the TUI agree. System/Light/Dark stay browser-local overrides.
  if(id&&id.startsWith('theme:')){
    const name=id.slice(6);
    api('/api/settings',{field:'theme',value:name}).then(r=>{if(r.settings)S.settings=r.settings;}).catch(()=>{});
  }
}
function buildThemeSelect(){
  // Default the web appearance from the shared `theme` setting (so `theme: supabase`
  // actually shows supabase) unless the browser has its own explicit override.
  let cur=localStorage.getItem('wa-theme');
  if(!cur){const t=((S.settings||[]).find(f=>f.name==='theme')||{}).value;cur=t?('theme:'+t):'system';}
  const base=[{value:'system',label:'System'},{value:'light',label:'Light'},{value:'dark',label:'Dark'}];
  const named=Object.keys(S.themes||{}).map(n=>({value:'theme:'+n,label:n}));
  $('#themeSelWrap').innerHTML=sel('themeSel',[...base,...named],cur,{cb:onWebThemePick});
  applyWebTheme(cur);
}

function attachJob(jobId,project){
  if(RUN.es)RUN.es.close();
  RUN={job:jobId,project:project,log:[],state:null,es:null,status:'running'};
  let tries=0;                          // exponential backoff: 1s,2s,4s… capped at 30s, give up after 8
  const connect=()=>{
    const es=new EventSource('/api/events?job='+jobId);RUN.es=es;
    es.onmessage=e=>{tries=0;           // a live message means the stream is healthy — reset backoff
      const ev=JSON.parse(e.data);
      if(ev.t==='log')RUN.log.push(ev.line);
      else if(ev.t==='project')RUN.project=ev.project;
      else if(ev.t==='state')RUN.state=ev.state;
      else if(ev.t==='done'){RUN.status=ev.status;RUN.log.push(ev.status==='error'?('[x] '+ev.error):('— '+ev.status+' —'));es.close();RUN.es=null;refreshState();}
      if(view==='run')renderRunInner();updateBadge();};
    es.onerror=()=>{                     // take over the browser's fixed-interval retry with a backoff
      es.close();if(RUN.es===es)RUN.es=null;
      if(RUN.status!=='running')return;
      if(tries>=8){RUN.log.push('· connection lost — reload the page to resume');if(view==='run')renderRunInner();return;}
      const delay=Math.min(1000*2**tries,30000);tries++;
      RUN.log.push(`· reconnecting in ${Math.round(delay/1000)}s…`);if(view==='run')renderRunInner();
      setTimeout(()=>{if(RUN.job===jobId&&RUN.status==='running')connect();},delay);};
  };
  connect();
  updateBadge();
}

  if(RUN.job&&RUN.status==='running'){b.style.display='flex';$('#runbadgeTxt').textContent=(RUN.project||'starting')+' · live';}else b.style.display='none';}

const PIPE={article:['sections','produce','learn','done'],book:['chapters','consolidate','production','learn','done']};
const PIPE_LABEL={sections:'Write',chapters:'Write',consolidate:'Consolidate',produce:'Assemble',production:'Assemble',learn:'Learn',done:'Done'};
function pipeHTML(phase,mode){
  const steps=PIPE[mode==='book'?'book':'article'];let cur=steps.indexOf(phase);if(cur<0)cur=(phase==='done'?steps.length-1:0);
  return steps.map((s,i)=>{const cls=i<cur?'done':i===cur?'on':'';
    const link=i<steps.length-1?`<span class="link ${i<cur?'done':''}"></span>`:'';
    return `<span class="step ${cls}"><span class="dot"></span>${PIPE_LABEL[s]||s}</span>${link}`;}).join('');
}
/* the newest recognizable log line -> a human "now doing X" activity (the run's heartbeat) */
function runActivity(log){
  for(let i=log.length-1;i>=0;i--){const l=log[i].trim();let m;
    if(/^== (Chapter|Section)/.test(l))return{lbl:l.replace(/^==\s*|\s*==$/g,''),sub:'starting this unit',work:1};
    if(/^writing \(draft\)/.test(l))return{lbl:'Drafting',sub:'the writer is composing',work:1};
    if((m=l.match(/^writing \(revision (\d+)\)/)))return{lbl:'Revising · pass '+m[1],sub:'applying the critic’s notes',work:1};
    if(/^critiqu/.test(l))return{lbl:'Critiquing',sub:'the critic is grading this draft',work:1};
    if(/research/i.test(l))return{lbl:'Researching',sub:'gathering and reading sources',work:1};
    if(/verif/i.test(l))return{lbl:'Verifying claims',sub:'checking each citation against its source',work:1};
    if(/humaniz/i.test(l))return{lbl:'Humanizing',sub:'stripping AI tells',work:1};
    if(/^\[OK\] committed/.test(l))return{lbl:l.replace('[OK] ','').replace(/^./,c=>c.toUpperCase()),sub:'committed to disk',work:0,ok:1};
    if(/^\[consolidat/.test(l))return{lbl:'Consolidating',sub:'cross-checking the whole piece',work:1};
    if(/^\[production\]/.test(l))return{lbl:'Assembling the manuscript',sub:'front/back matter and exports',work:1};
    if(/^\[learn\]/.test(l))return{lbl:'Learning',sub:'distilling reusable craft skills',work:1};
    if(/^[—-].*[—-]$/.test(l))return{lbl:'Finished',sub:'',work:0,ok:1};
  }
  return{lbl:'Starting the run',sub:'warming up',work:1};
}
function runVerdict(log){
  for(let i=log.length-1;i>=0;i--){const m=log[i].match(/verdict=(\w+)\s+confidence=([\d.]+)\s+blocking=(\d+)\s+nits=(\d+)/);
    if(m)return{v:m[1],conf:m[2],blk:m[3],nits:m[4]};}
  return null;
}
function renderRun(){$('#view').innerHTML=head('Live','Run')+'<div id="runWrap"></div>';RUN._shell='';renderRunInner();}
function renderRunInner(){
  const w=$('#runWrap');if(!w)return;const st=RUN.state||{};
  if(!RUN.job){if(RUN._shell!=='empty'){w.innerHTML='<div class="card"><div class="muted">No live run. Start one in the Studio, or resume from Projects.</div></div>';RUN._shell='empty';}return;}
  // Rebuild the shell ONLY when the job or status changes - so the spinner and phase pulse
  // animate continuously through the stream instead of restarting on every log event.
  const key=RUN.job+'|'+RUN.status;
  if(RUN._shell!==key){
    RUN._shell=key;RUN._pipe='';RUN._logN=0;
    const done=RUN.status==='done',err=RUN.status==='error';
    const db=(done&&RUN.project)?`<div class="banner success"><span class="bi">✓</span>
      <div style="flex:1">Finished — <b>${esc(RUN.project)}</b> is ready to read.</div>
      <button class="primary" onclick="go('project','${RUN.project}')">Open the piece →</button></div>`:'';
    w.innerHTML=db+`<div class="card">
      <div class="row" style="margin-bottom:14px">
        <span class="chip ${RUN.status==='running'?'blue':done?'ok':err?'err':''}">${RUN.status}</span>
        <span class="chip">${esc(RUN.project||'starting…')}</span>
        <span class="chip" id="rnUnit"></span><span id="rnVerdict"></span>
        <span class="spacer"></span>
        ${RUN.status==='running'?'<button onclick="pauseRun()">Pause</button>':''}
        ${RUN.project?`<button class="secondary" onclick="go('project','${RUN.project}')">Open project</button>`:''}</div>
      <div class="pipe" id="rnPipe"></div>
      <div class="nowline" id="rnNow"><span class="spin"></span><div><div class="lbl2" id="rnNowLbl"></div><div class="sub2" id="rnNowSub"></div></div></div>
      <div class="bar"><i id="rnBar"></i></div>
      <div id="log" role="log"></div></div>`;
  }
  const total=st.num_sections||st.num_chapters||0,done=st.committed||0,pct=total?done/total:(RUN.status==='done'?1:0);
  const unit=$('#rnUnit');if(unit)unit.textContent=`${done}/${total||'?'} committed`;
  const phase=st.phase||(RUN.status==='done'?'done':'sections');
  if(RUN._pipe!==phase){RUN._pipe=phase;const pe=$('#rnPipe');if(pe)pe.innerHTML=pipeHTML(phase,st.num_chapters?'book':'article');}
  const bar=$('#rnBar');if(bar)bar.style.transform=`scaleX(${pct.toFixed(3)})`;
  const vd=runVerdict(RUN.log),ve=$('#rnVerdict');
  if(ve)ve.innerHTML=vd?`<span class="chip ${vd.v==='approve'?'ok':'warn'}" data-tip="critic confidence ${vd.conf} · ${vd.blk} blocking, ${vd.nits} nits">critic: ${esc(vd.v)}</span>`:'';
  const act=RUN.status==='running'?runActivity(RUN.log):(RUN.status==='done'?{lbl:'Finished',sub:'',ok:1}:{lbl:RUN.status,sub:''});
  const now=$('#rnNow');if(now){now.className='nowline'+(act.work?'':(act.ok?' ok':' idle'));
    $('#rnNowLbl').textContent=act.lbl;$('#rnNowSub').textContent=act.sub||'';}
  // Append only the new lines (textContent, not innerHTML) - O(delta) per event instead of
  // re-escaping the whole log, and no HTML-injection surface.
  const lg=$('#log');if(lg){
    if(RUN.log.length<RUN._logN){lg.textContent=RUN.log.join('\n');}          // log shrank (new job)
    else if(RUN.log.length>RUN._logN){
      if(!RUN._logN)lg.textContent=RUN.log.join('\n');                        // first real lines: replace placeholder
      else lg.appendChild(document.createTextNode('\n'+RUN.log.slice(RUN._logN).join('\n')));
    }else if(!RUN._logN&&!lg.textContent){lg.textContent='· awaiting first line…';}
    RUN._logN=RUN.log.length;lg.scrollTop=lg.scrollHeight;
  }
}

    <span class="small" id="kt-${it.env}" style="margin-left:2px"></span></div>`;
  el.innerHTML=`<div class="section"><div class="lbl">model hosts</div>
      <div class="muted small" style="margin-bottom:10px">Keys are written to <code>.env</code> in the agent home and shared by the web dashboard and the TUI. Set the key for the host you run on (choose it under App → <code>provider</code>), then <b>verify</b> to confirm it works.</div>
      ${k.hosts.map(h=>row('host',h)).join('')}</div>
    <div class="section"><div class="lbl">web search</div>
      <div class="muted small" style="margin-bottom:10px">Only the provider you pick under Research needs a key; DuckDuckGo is keyless. <b>verify</b> runs one live search.</div>
      ${k.search.map(s=>row('search',s)).join('')}</div>
    ${(k.images&&k.images.length)?`<div class="section"><div class="lbl">image sources</div>
      <div class="muted small" style="margin-bottom:10px">Openverse and Wikimedia are keyless — no key needed. These stock providers need a free API key; only sources you pick under Research → <code>image_source</code> are used. <b>verify</b> runs one live fetch.</div>
      ${k.images.map(s=>row('image',s)).join('')}</div>`:''}`;
}
async function saveKey(env){
  const inp=$('#key-'+env);const v=inp?inp.value.trim():'';
  if(!v)return toast('paste a key first',1);
  try{await api('/api/setkey',{env,value:v});toast(env+' saved');renderKeys($('#setBody'));}catch(e){toast(e.message,1)}}
async function testKey(kind,id,env){
  const s=$('#kt-'+env);if(s){s.textContent='verifying…';s.style.color='var(--fg-3)';}
  try{const r=await api('/api/testkey',{kind,id});if(s){s.textContent=(r.ok?'✓ ':'✗ ')+r.detail;s.style.color=r.ok?'var(--green)':'var(--red)';}}
  catch(e){if(s){s.textContent='✗ '+e.message;s.style.color='var(--red)';}}}
async function saveSetting(name){
  const sent=ctrlVal('st-'+name);
  try{
    const r=await api('/api/settings',{field:name,value:sent});
    if(r.settings)S.settings=r.settings;                          // keep the client in sync with the APPLIED value
    const f=(r.settings||[]).find(x=>x.name===name);
    const av=f?String(f.value):sent;
    const gen=String(((r.settings||[]).find(x=>x.name==='image_source')||{}).value||'').split(',').includes('generate');
    const L=flabel(name);
    if(name==='theme'&&av){applyWebTheme('theme:'+av);buildThemeSelect();toast('Theme set to '+av);}  // apply to the web live + sync the top-right
    else if(name==='image_model'&&!av&&gen)toast('“Generate” needs an image model — until you set one, images fall back to the stock sources',1);
    else if(av==='')toast(L+' cleared');                          // empty is valid for most fields; say so honestly
    else if(av!==String(sent))toast(L+' adjusted to '+av);        // server clamped it (e.g. Minimum insight 99 → 5)
    else toast(L+' saved');
    if(name==='mode'&&view==='settings')renderSetBody();          // format change hides/shows book- vs article-only rows
  }catch(e){toast(e.message,1)}}
async function saveModel(node,btn){const el=btn.parentElement.querySelector('[data-n]');
  try{await api('/api/models',{node,slug:el.value});toast(flabel(node)+' model set to '+el.value);}catch(e){toast(e.message,1)}}

function toggleSide(){const on=document.body.classList.toggle('side-collapsed');try{localStorage.setItem('sideCollapsed',on?'1':'');}catch(e){}}
try{if(localStorage.getItem('sideCollapsed'))document.body.classList.add('side-collapsed');}catch(e){}   // restore the last state
refreshState().then(()=>location.hash?applyHash():render());   /* theme change is handled by the custom-select cb (applyWebTheme) */
setInterval(()=>{if(view!=='projects')return;refreshState().then(()=>{   // re-render only when the
  const snap=JSON.stringify(S.projects);                                       // data changed - a blind
  if(view==='projects'&&snap!==_projSnap){_projSnap=snap;render();}});},6000); // repaint replays the fade
</script>
