<svg xmlns="http://www.w3.org/2000/svg" width="592" height="362" viewBox="0 0 592 362"><rect width="592" height="362" fill="#f8f9fb" rx="12"/><text x="296" y="34" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" fill="#111">Managed WebRTC vs. Raw WebSockets for Audio</text><text x="296" y="55" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#5b6470">Why transport-level intelligence protects the real-time pipeline</text><text x="138" y="85" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700" fill="#4f8ef7">Transport Layer</text><line x1="40" y1="91" x2="236" y2="91" stroke="#4f8ef7" stroke-width="2"/><text x="454" y="85" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700" fill="#34c98a">Media Protection</text><line x1="356" y1="91" x2="552" y2="91" stroke="#34c98a" stroke-width="2"/><path d="M 236 138 L 356 138" fill="none" stroke="#64748b" stroke-width="1.6"/><polygon points="356.0,137.5 345.0,143.0 345.0,132.0" fill="#64748b"/><rect x="268" y="129" width="57" height="17" rx="7" fill="#f8f9fb"/><text x="296" y="141" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5b6470">provides</text><path d="M 236 162 L 356 192" fill="none" stroke="#64748b" stroke-width="1.6"/><polygon points="356.0,192.0 344.0,194.7 346.7,184.0" fill="#64748b"/><path d="M 191 164 L 401 269" fill="none" stroke="#64748b" stroke-width="1.6"/><polygon points="401.0,269.0 388.7,269.0 393.6,259.2" fill="#64748b"/><path d="M 236 192 L 356 162" fill="none" stroke="#64748b" stroke-width="1.6"/><polygon points="356.0,162.0 346.7,170.0 344.0,159.3" fill="#64748b"/><rect x="276" y="168" width="39" height="17" rx="7" fill="#f8f9fb"/><text x="296" y="180" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5b6470">lacks</text><path d="M 236 216 L 356 216" fill="none" stroke="#64748b" stroke-width="1.6"/><polygon points="356.0,216.5 345.0,222.0 345.0,211.0" fill="#64748b"/><path d="M 236 241 L 356 271" fill="none" stroke="#64748b" stroke-width="1.6"/><polygon points="356.0,271.0 344.0,273.7 346.7,263.0" fill="#64748b"/><path d="M 401 164 L 191 269" fill="none" stroke="#64748b" stroke-width="1.6"/><polygon points="191.0,269.0 198.4,259.2 203.3,269.0" fill="#64748b"/><rect x="269" y="208" width="54" height="17" rx="7" fill="#f8f9fb"/><text x="296" y="220" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5b6470">protects</text><path d="M 356 241 L 236 271" fill="none" stroke="#64748b" stroke-width="1.6"/><polygon points="236.0,271.0 245.3,263.0 248.0,273.7" fill="#64748b"/><path d="M 356 296 L 236 296" fill="none" stroke="#64748b" stroke-width="1.6"/><polygon points="236.0,295.5 247.0,290.0 247.0,301.0" fill="#64748b"/><g><rect x="40" y="111" width="196" height="53" rx="9" fill="#4f8ef7" fill-opacity="0.14" stroke="#4f8ef7" stroke-width="1.6"/><text x="138" y="133" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#1a1a1a"><tspan x="138" dy="0">Managed WebRTC</tspan></text><text x="138" y="147" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5b6470">Adaptive jitter buffer, bandwidth estimation, FEC</text></g><g><rect x="40" y="190" width="196" height="53" rx="9" fill="#4f8ef7" fill-opacity="0.14" stroke="#4f8ef7" stroke-width="1.6"/><text x="138" y="212" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#1a1a1a"><tspan x="138" dy="0">Raw WebSockets</tspan></text><text x="138" y="226" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5b6470">No built-in media handling</text></g><g><rect x="356" y="111" width="196" height="53" rx="9" fill="#34c98a" fill-opacity="0.14" stroke="#34c98a" stroke-width="1.6"/><text x="454" y="133" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#1a1a1a"><tspan x="454" dy="0">Jitter Buffer</tspan></text><text x="454" y="147" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5b6470">Dynamic ≤ 80 ms target</text></g><g><rect x="356" y="190" width="196" height="53" rx="9" fill="#34c98a" fill-opacity="0.14" stroke="#34c98a" stroke-width="1.6"/><text x="454" y="212" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#1a1a1a"><tspan x="454" dy="0">Bandwidth Estimation</tspan></text><text x="454" y="226" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5b6470">GCC/TWCC, adapts bitrate</text></g><g><rect x="356" y="269" width="196" height="53" rx="9" fill="#34c98a" fill-opacity="0.14" stroke="#34c98a" stroke-width="1.6"/><text x="454" y="291" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#1a1a1a"><tspan x="454" dy="0">Backpressure Handling</tspan></text><text x="454" y="305" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5b6470">Drops packets, not pipeline</text></g><g><rect x="40" y="269" width="196" height="53" rx="9" fill="#64748b" fill-opacity="0.14" stroke="#64748b" stroke-width="2.6"/><text x="138" y="291" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#1a1a1a"><tspan x="138" dy="0">Audio Pipeline</tspan></text><text x="138" y="305" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5b6470">Stable, low-latency output</text></g></svg>