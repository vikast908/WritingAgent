[project]
name = "book-agent"
version = "0.1.0"
description = "A self-correcting, multi-book writing system (CLI)."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "markdown>=3.5",
  "xhtml2pdf>=0.2.11",
  "rich>=13.0",
  "pyfiglet>=1.0",
  "prompt_toolkit>=3.0",
  "ddgs>=0.1",
  "headroom-ai",
]

[project.scripts]
writing-agent = "book_agent.cli:main"
bookwriter = "book_agent.cli:main"
book = "book_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
