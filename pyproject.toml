[project]
name = "writing-agent"
dynamic = ["version"]   # single source: src/writingagent/__init__.py __version__
description = "A self-correcting, autonomous writing system for books and articles (CLI/TUI)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WRITING AGENT contributors" }]
keywords = ["llm", "writing", "agent", "books", "articles", "openrouter", "deepseek", "cli", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=1.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "markdown>=3.5",
  "xhtml2pdf>=0.2.11",
  # Transitive via xhtml2pdf. svglib 1.6.0 hard-requires rlpycairo -> pycairo, and
  # pycairo ships no Linux wheels - a bare `pip install` on Linux then fails trying to
  # build it from source (needs pkg-config + libcairo2-dev). 1.5.x has no cairo chain;
  # xhtml2pdf only needs svglib's svg2rlg, not the cairo rasterizer.
  "svglib<1.6",
  "rich>=13.0",
  "pyfiglet>=1.0",
  "prompt_toolkit>=3.0",
  "ddgs>=0.1",
  "ebooklib>=0.18",
]

[project.optional-dependencies]
# Context compression. The library is optional (llm.py imports it lazily and
# degrades gracefully). On Linux/macOS the latest headroom-ai ships prebuilt
# Rust wheels, so it installs cleanly here. On Windows there is no wheel and the
# transitive `litellm` has paths long enough to break installs without long-path
# support - there, install the last pure-Python release without its deps:
#   pip install --only-binary=:all: --no-deps "headroom-ai==0.10.17"
# (tiktoken is the only piece we actually need for token counting.)
headroom = [
  "tiktoken>=0.5",
  "headroom-ai>=0.21; sys_platform != 'win32'",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]
# Deep-researcher fetch backend. Optional: deep_research.py imports Scrapo lazily and
# falls back to a stdlib urllib + html.parser fetch when it's absent. Scrapo is not on
# PyPI (install from git) and needs Python 3.11+, so it's gated by a marker; on 3.10 the
# stdlib path is always used. Playwright powers Scrapo's browser tier (JS-heavy / blocked
# pages); after install run `python -m playwright install chromium` for the browser binary.
deep = [
  "scrapo @ git+https://github.com/vikast908/Scrapo ; python_version >= '3.11'",
  "playwright>=1.40 ; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/vikast908/WritingAgent"
Repository = "https://github.com/vikast908/WritingAgent"
Issues = "https://github.com/vikast908/WritingAgent/issues"

[project.scripts]
writing-agent = "writingagent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "writingagent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",   # line length is handled by the formatter, not enforced hard
  "B008",   # function calls in argument defaults (argparse/Field patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011", "E731"]
# The orchestrator package __init__ is a pure facade: it re-exports the seam
# submodules (from .common import * etc.) so `orchestrator.X` keeps resolving for
# every caller and test. Star re-exports are intentional here.
"src/writingagent/orchestrator/__init__.py" = ["F401", "F403", "F405"]
"src/writingagent/shell/__init__.py" = ["F401", "F403", "F405"]

[tool.pytest.ini_options]
pythonpath = ["src"]   # tests import writingagent from src without an install
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
