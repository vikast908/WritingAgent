[project]
name = "book-agent"
version = "0.1.0"
description = "A self-correcting, multi-book writing system (CLI)."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "markdown>=3.5",
  "xhtml2pdf>=0.2.11",
  "rich>=13.0",
  "pyfiglet>=1.0",
  "prompt_toolkit>=3.0",
  "ddgs>=0.1",
  "ebooklib>=0.18",
]

# Context compression is optional (llm.py imports headroom lazily and degrades
# gracefully if it is absent). It is NOT a hard dependency because headroom-ai
# >=0.21 is a Rust/pyo3 extension with no published Windows wheel, and its
# transitive `litellm` ships absurdly long nested paths that break installs on
# Windows without long-path support. 0.10.17 is the last pure-Python release
# whose compressor still works without the native `_core` module. Install it
# WITHOUT its deps (we only need tiktoken, declared here):
#   pip install --only-binary=:all: --no-deps "headroom-ai==0.10.17"
[project.optional-dependencies]
headroom = ["tiktoken>=0.5"]

[project.scripts]
writing-agent = "book_agent.cli:main"
bookwriter = "book_agent.cli:main"
book = "book_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
