<svg viewBox="0 0 1280 320" width="1280" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Writing Agent - a self-correcting, autonomous writing system that turns a topic into a publication-ready manuscript">
  <title>Writing Agent</title>
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }

    .t      { opacity: 1; }
    .cursor { opacity: 1; }
    .stage  { fill: #c9d1d9; }

    @media (prefers-reduced-motion: no-preference) {
      .t      { opacity: 0; animation: show 0.01s steps(1, end) forwards; }
      .cursor { opacity: 0; animation: blink 1.1s steps(1, end) infinite; animation-delay: 7.6s; }
      .stage  { animation: stagecycle 10s steps(1, end) infinite; }
      @keyframes show  { to { opacity: 1; } }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
      @keyframes stagecycle {
        0%, 19.9% { fill: #3fb950; }
        20%, 100% { fill: #8b949e; }
      }
    }
  </style>

  <!-- terminal window -->
  <rect x="1" y="1" width="1278" height="318" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1.75" y="1.75" width="1276.5" height="34" rx="11" fill="#161b22"/>
  <rect x="1.75" y="24" width="1276.5" height="12" fill="#161b22"/>
  <path d="M 1 36 h 1278" stroke="#30363d" stroke-width="1"/>

  <circle cx="26" cy="19" r="6" fill="#f85149"/>
  <circle cx="48" cy="19" r="6" fill="#d29922"/>
  <circle cx="70" cy="19" r="6" fill="#3fb950"/>
  <text x="640" y="23" font-size="12" fill="#8b949e" text-anchor="middle">writing-agent · self-correcting session</text>

  <!-- ===== left pane ===== -->
  <text class="t" style="animation-delay:.2s" y="64"><tspan x="48" fill="#3fb950">$</tspan><tspan x="64" fill="#c9d1d9">writing-agent --topic "the city after print" --book</tspan></text>

  <g font-size="12" fill="#3fb950">
    <text class="t" style="animation-delay:.55s" x="48 55.2 120 127.2 134.4 141.6 148.8 156 177.6 184.8 192 206.4 213.6 220.8 228 235.2 249.6 256.8 264 278.4 307.2 328.8 336 343.2 350.4 400.8 436.8 444 451.2 458.4 472.8 480 487.2 494.4 501.6 516 544.8 559.2 566.4 573.6 580.8 588" y="92">__________________________________________</text>
