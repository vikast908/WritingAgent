  </g>

  <g>
    <text class="t" style="animation-delay:1.6s" y="200"><tspan class="stage" style="animation-delay:-10s" x="48">write</tspan><tspan class="stage" style="animation-delay:-8s" x="118.2">critique</tspan><tspan class="stage" style="animation-delay:-6s" x="211.8">revise</tspan><tspan class="stage" style="animation-delay:-4s" x="289.8">humanise</tspan><tspan class="stage" style="animation-delay:-2s" x="383.4">commit</tspan><tspan fill="#2f6f3f" x="94.8">-&gt;</tspan><tspan fill="#2f6f3f" x="188.4">-&gt;</tspan><tspan fill="#2f6f3f" x="266.4">-&gt;</tspan><tspan fill="#2f6f3f" x="360">-&gt;</tspan></text>
    <text class="t" style="animation-delay:1.75s" y="216" fill="#484f58"><tspan x="63.6">^</tspan><tspan x="422.4">|</tspan></text>
    <text class="t" style="animation-delay:1.9s" fill="#484f58" x="63.6 71.4 79.2 87 94.8 102.6 110.4 118.2 126 133.8 141.6 157.2 165 172.8 180.6 188.4 204 211.8 227.4 235.2 243 250.8 258.6 266.4 282 289.8 297.6 313.2 321 328.8 344.4 352.2 360 367.8 375.6 383.4 391.2 399 406.8 414.6 422.4" y="232">'----------untilitclearsthebar----------'</text>
  </g>

  <text class="t" style="animation-delay:2.1s" x="48" y="266" font-size="12" fill="#8b949e">guardrails: no filler · no purple prose · no "delve" · no em-dashes</text>
  <text class="t" style="animation-delay:2.2s" x="48" y="296" font-size="11.5" fill="#6e7681">books · articles · deep web research · continuity audits · front/back matter</text>

  <!-- ===== right pane: agent log panel ===== -->
  <rect x="676" y="56" width="560" height="240" rx="8" fill="none" stroke="#30363d" stroke-width="1.2"/>
  <rect x="694" y="49" width="84" height="14" fill="#0d1117"/>
  <text class="t" style="animation-delay:2.25s" x="700" y="61" font-size="12" fill="#8b949e">agent log</text>

  <g>
    <text class="t" style="animation-delay:2.3s" y="84"><tspan x="700" fill="#39c5cf">[research]</tspan><tspan x="794" fill="#c9d1d9">6 sources · 4 domains · full text</tspan></text>
    <text class="t" style="animation-delay:2.8s" y="106"><tspan x="700" fill="#58a6ff">[write]</tspan><tspan x="794" fill="#c9d1d9">drafting ch. 3 · "the night shift"</tspan></text>
    <text class="t" style="animation-delay:3.3s" y="128"><tspan x="700" fill="#d29922">[critique]</tspan><tspan x="794" fill="#c9d1d9">flagged: cliched opener (1 issue)</tspan></text>
    <text class="t" style="animation-delay:3.8s" y="150"><tspan x="700" fill="#f85149">[revise]</tspan><tspan x="794" fill="#f85149">- In today's fast-paced digital age,</tspan></text>
    <text class="t" style="animation-delay:4.3s" y="172"><tspan x="700" fill="#3fb950">[humanise]</tspan><tspan x="794" fill="#3fb950">+ The night the printers stopped,</tspan></text>
    <text class="t" style="animation-delay:4.8s" y="194"><tspan x="700" fill="#bc8cff">[loop]</tspan><tspan x="794" fill="#8b949e">pass 2 of 5 · re-critiquing draft</tspan></text>
    <text class="t" style="animation-delay:5.3s" y="216"><tspan x="700" fill="#3fb950">[commit]</tspan><tspan x="794" fill="#c9d1d9">✓ accepted · publication-ready</tspan></text>
  </g>
  <rect class="cursor" x="1036" y="204" width="8" height="15" fill="#3fb950"/>

  <line x1="694" y1="238" x2="1218" y2="238" stroke="#21262d" stroke-width="1"/>

