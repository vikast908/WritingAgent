<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <rect x="0.5" y="0.5" width="999" height="349" rx="14" fill="#f8f9fb" stroke="#e6e9ef"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111">A multi-agent pipeline on a durable state machine</text>

  <!-- top row: Interface -> Orchestrator -> Agents -> Memory -->
  <g>
    <rect x="24" y="58" width="210" height="116" rx="10" fill="#e9f1fe" stroke="#4f8ef7" stroke-width="1.8"/>
    <text x="129" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Interface</text>
    <text x="129" y="124" text-anchor="middle" font-size="12.5" fill="#5b6470">TUI · CLI</text>
    <text x="129" y="148" text-anchor="middle" font-size="12.5" fill="#5b6470">Python API</text>
  </g>
  <g>
    <rect x="271" y="58" width="210" height="116" rx="10" fill="#f1ecfe" stroke="#a78bfa" stroke-width="1.8"/>
    <text x="376" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Orchestrator</text>
    <text x="376" y="116" text-anchor="middle" font-size="12.5" fill="#5b6470">durable state machine</text>
    <text x="376" y="138" text-anchor="middle" font-size="12.5" fill="#5b6470">write → critique →</text>
    <text x="376" y="160" text-anchor="middle" font-size="12.5" fill="#5b6470">revise → commit</text>
  </g>
  <g>
    <rect x="518" y="58" width="210" height="116" rx="10" fill="#fff0e6" stroke="#ff6719" stroke-width="1.8"/>
    <text x="623" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Agents</text>
    <text x="623" y="124" text-anchor="middle" font-size="12.5" fill="#5b6470">Writer → Critic →</text>
    <text x="623" y="148" text-anchor="middle" font-size="12.5" fill="#5b6470">Judge → Humanizer</text>
  </g>
  <g>
    <rect x="765" y="58" width="210" height="116" rx="10" fill="#e7faf1" stroke="#34c98a" stroke-width="1.8"/>
    <text x="870" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Memory</text>
    <text x="870" y="116" text-anchor="middle" font-size="12.5" fill="#5b6470">markdown brain</text>
    <text x="870" y="138" text-anchor="middle" font-size="12.5" fill="#5b6470">canon · skills</text>
    <text x="870" y="160" text-anchor="middle" font-size="12.5" fill="#5b6470">versions</text>
  </g>

  <!-- top-row arrows -->
  <g stroke="#64748b" stroke-width="1.8" fill="none">
    <path d="M 234 116 H 268"/><path d="M 481 116 H 515"/><path d="M 728 116 H 762"/>
  </g>
  <g fill="#64748b">
    <polygon points="271,116 262,111 262,121"/>
    <polygon points="518,116 509,111 509,121"/>
    <polygon points="765,116 756,111 756,121"/>
  </g>

  <!-- models tier: every agent routes to its own model -->
  <g>
    <rect x="523" y="220" width="200" height="56" rx="10" fill="#e6f6fd" stroke="#0ea5e9" stroke-width="1.8"/>
    <text x="623" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Models</text>
    <text x="623" y="266" text-anchor="middle" font-size="12.5" fill="#5b6470">OpenRouter · DeepSeek</text>
  </g>
  <path d="M 623 174 V 220" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="623,220 618,211 628,211" fill="#64748b"/>
  <rect x="566" y="189" width="114" height="18" rx="7" fill="#f8f9fb"/>
  <text x="623" y="202" text-anchor="middle" font-size="11.5" fill="#5b6470">per-agent tier</text>

  <!-- learner feedback loop: memory -> orchestrator (skills compound) -->
  <path d="M 870 174 V 312 H 376 V 178" stroke="#64748b" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/>
  <polygon points="376,174 371,183 381,183" fill="#64748b"/>
  <rect x="471" y="303" width="304" height="18" rx="7" fill="#f8f9fb"/>
  <text x="623" y="316" text-anchor="middle" font-size="11.5" fill="#5b6470">Learner - distills skills that compound on the next run</text>
</svg>
