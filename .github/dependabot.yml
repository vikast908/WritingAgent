version: 2
updates:
  # Python dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # svglib is pinned <1.6 on purpose: >=1.6 pulls rlpycairo -> pycairo, which has no Linux
      # wheels, so a bare `pip install` breaks on Linux. Do not let Dependabot bump it.
      - dependency-name: "svglib"
    labels: ["dependencies"]

  # GitHub Actions used in workflows (keeps pinned action versions fresh)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
